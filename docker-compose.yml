version: "3.9"

# =============================================================
# HỆ THỐNG TUYỂN DỤNG THÔNG MINH – Smart Recruitment System
# Kiến trúc Polyglot Persistence:
#   PostgreSQL  → Tài khoản, Ứng tuyển, Lịch phỏng vấn
#   MongoDB     → Hồ sơ ứng viên, Tin tuyển dụng, Đánh giá
#   Redis       → Session, Cache, Pub/Sub thông báo
#   Neo4j       → Gợi ý thông minh (AI Matching)
#   Cassandra   → Event log, Thống kê hành vi
# =============================================================
# Browser UIs (development only, no profile needed):
#   pgAdmin       → http://localhost:5050   (PostgreSQL)
#   Mongo Express → http://localhost:8081   (MongoDB)
#   RedisInsight  → http://localhost:5540   (Redis)
#   Cassandra Web → http://localhost:8888   (Cassandra)
#   Neo4j Browser → http://localhost:7474   (Neo4j) ← built-in
# =============================================================

networks:
    srs_network:
        driver: bridge

volumes:
    postgres_data:
    mongo_data:
    redis_data:
    neo4j_data:
    neo4j_logs:
    neo4j_plugins:
    cassandra_data:
    backend_uploads:
    pgadmin_data:
    redisinsight_data:

services:
    # ============================================================
    # POSTGRESQL – NV01, NV05, NV07
    # Quản lý tài khoản, đơn ứng tuyển, lịch phỏng vấn
    # ============================================================
    postgres:
        image: postgres:16-alpine
        container_name: srs_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-srs_db}
            POSTGRES_USER: ${POSTGRES_USER:-srs_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-srs_password}
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
        ports:
            - "5432:5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-srs_user} -d ${POSTGRES_DB:-srs_db}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - srs_network

    # ============================================================
    # PGADMIN – Browser UI for PostgreSQL
    # http://localhost:5050
    # Login: admin@srs.local / srs_pgadmin_pass (or PGADMIN_* env)
    # ============================================================
    pgadmin:
        image: dpage/pgadmin4:latest
        container_name: srs_pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@srs.dev
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-srs_pgadmin_pass}
            PGADMIN_CONFIG_SERVER_MODE: "False"
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
        volumes:
          - pgadmin_data:/var/lib/pgadmin
        ports:
            - "5050:80"
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - srs_network

    # ============================================================
    # MONGODB – NV02, NV03, NV04, NV09
    # Hồ sơ ứng viên, tin tuyển dụng, đánh giá công ty
    # ============================================================
    mongo:
        image: mongo:7.0
        container_name: srs_mongo
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-srs_admin}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-srs_mongo_pass}
            MONGO_INITDB_DATABASE: ${MONGO_DB:-srs_mongo}
        volumes:
            - mongo_data:/data/db
            - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
        ports:
            - "27017:27017"
        healthcheck:
            test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
            interval: 10s
            timeout: 10s
            retries: 5
        networks:
            - srs_network

    # ============================================================
    # MONGO EXPRESS – Browser UI for MongoDB
    # http://localhost:8081
    # Login: srs_admin / srs_mongo_pass (mirrors MONGO_ROOT_* env)
    # ============================================================
    mongo-express:
        image: mongo-express:1.0.2
        container_name: srs_mongo_express
        restart: unless-stopped
        environment:
            ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-srs_admin}
            ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-srs_mongo_pass}
            ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-srs_admin}:${MONGO_ROOT_PASSWORD:-srs_mongo_pass}@mongo:27017/
            ME_CONFIG_BASICAUTH: "false"
        ports:
            - "8081:8081"
        depends_on:
            mongo:
                condition: service_healthy
        networks:
            - srs_network

    # ============================================================
    # REDIS – NV08
    # Session JWT, Cache gợi ý, Pub/Sub thông báo realtime
    # ============================================================
    redis:
        image: redis:7.2-alpine
        container_name: srs_redis
        restart: unless-stopped
        command: >
            redis-server
            --requirepass ${REDIS_PASSWORD:-srs_redis_pass}
            --maxmemory 512mb
            --maxmemory-policy allkeys-lru
            --save 60 1000
            --appendonly yes
        volumes:
            - redis_data:/data
        ports:
            - "6379:6379"
        healthcheck:
            test:
                [
                    "CMD",
                    "redis-cli",
                    "-a",
                    "${REDIS_PASSWORD:-srs_redis_pass}",
                    "ping",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - srs_network

    # ============================================================
    # REDISINSIGHT – Browser UI for Redis
    # http://localhost:5540
    # No login required; add Redis connection manually on first visit:
    #   Host: redis  Port: 6379  Password: srs_redis_pass
    # ============================================================
    redisinsight:
        image: redis/redisinsight:latest
        container_name: srs_redisinsight
        restart: unless-stopped
        volumes:
            - redisinsight_data:/data
        ports:
            - "5540:5540"
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - srs_network

    # ============================================================
    # NEO4J – NV06
    # Gợi ý thông minh AI Matching: Candidate–Skill–Job graph
    # ============================================================
    neo4j:
        image: neo4j:5.26.25-community
        container_name: srs_neo4j
        restart: unless-stopped
        environment:
            NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-srs_neo4j_pass}
            NEO4J_PLUGINS: '["apoc"]'
            NEO4J_dbms_security_procedures_unrestricted: apoc.*
            NEO4J_dbms_memory_heap_initial__size: 512m
            NEO4J_dbms_memory_heap_max__size: 1G
            NEO4J_dbms_memory_pagecache_size: 512m
        volumes:
            - neo4j_data:/data
            - neo4j_logs:/logs
            - neo4j_plugins:/plugins
            - ./db/neo4j/init:/docker-entrypoint-initdb.d:ro
        ports:
            - "7474:7474" # Neo4j Browser (HTTP) ← built-in UI
            - "7687:7687" # Bolt protocol
        healthcheck:
            test: ["CMD", "neo4j", "status"]
            interval: 30s
            timeout: 10s
            retries: 10
        networks:
            - srs_network

    # ============================================================
    # CASSANDRA – NV10
    # Event log hành vi người dùng, thống kê time-series
    # ============================================================
    cassandra:
        image: cassandra:4.1
        container_name: srs_cassandra
        restart: unless-stopped
        environment:
            CASSANDRA_CLUSTER_NAME: SRSCluster
            CASSANDRA_DC: datacenter1
            CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
            CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
            CASSANDRA_AUTHORIZER: CassandraAuthorizer
            HEAP_NEWSIZE: 128M
            MAX_HEAP_SIZE: 512M
        volumes:
            - cassandra_data:/var/lib/cassandra
            - ./db/cassandra/init:/docker-entrypoint-initdb.d:ro
        ports:
            - "9042:9042" # CQL native transport
        healthcheck:
            test: ["CMD", "cqlsh", "-e", "DESCRIBE keyspaces;"]
            interval: 30s
            timeout: 15s
            retries: 10
            start_period: 60s
        networks:
            - srs_network

    # ============================================================
    # CASSANDRA WEB – Browser UI for Cassandra
    # http://localhost:8888
    # ============================================================
    cassandra-web:
        image: ipushc/cassandra-web:latest
        container_name: srs_cassandra_web
        restart: unless-stopped
        environment:
            CASSANDRA_HOST: cassandra
            CASSANDRA_PORT: 9042
            CASSANDRA_USERNAME: ${CASSANDRA_USER:-cassandra}
            CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD:-cassandra}
        ports:
            - "8888:8888"
        depends_on:
            cassandra:
                condition: service_healthy
        networks:
            - srs_network

    # ============================================================
    # BACKEND – Node.js API Server
    # ============================================================
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
            target: ${NODE_ENV:-development}
        container_name: srs_backend
        restart: unless-stopped
        env_file:
            - .env
        environment:
            NODE_ENV: ${NODE_ENV:-development}
            PORT: 3000
            # PostgreSQL
            DATABASE_URL: postgresql://${POSTGRES_USER:-srs_user}:${POSTGRES_PASSWORD:-srs_password}@postgres:5432/${POSTGRES_DB:-srs_db}
            # MongoDB
            MONGO_URI: mongodb://${MONGO_ROOT_USER:-srs_admin}:${MONGO_ROOT_PASSWORD:-srs_mongo_pass}@mongo:27017/${MONGO_DB:-srs_mongo}?authSource=admin
            # Redis
            REDIS_URL: redis://:${REDIS_PASSWORD:-srs_redis_pass}@redis:6379
            # Neo4j
            NEO4J_URI: bolt://neo4j:7687
            NEO4J_USER: ${NEO4J_USER:-neo4j}
            NEO4J_PASSWORD: ${NEO4J_PASSWORD:-srs_neo4j_pass}
            # Cassandra
            CASSANDRA_CONTACT_POINTS: cassandra
            CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE:-srs_events}
            CASSANDRA_USER: ${CASSANDRA_USER:-cassandra}
            CASSANDRA_PASSWORD: ${CASSANDRA_PASSWORD:-cassandra}
        volumes:
            - ./backend:/app
            - /app/node_modules
            - backend_uploads:/app/uploads
        ports:
            - "3000:3000"
        depends_on:
            postgres:
                condition: service_healthy
            mongo:
                condition: service_healthy
            redis:
                condition: service_healthy
            neo4j:
                condition: service_healthy
            cassandra:
                condition: service_healthy
        networks:
            - srs_network

